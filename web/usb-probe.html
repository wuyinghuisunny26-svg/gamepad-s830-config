<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USB 探测 · 手柄控制</title>
<link rel="stylesheet" href="style.css">
<style>
  .mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 11.5px; }
  .row2 { display: grid; grid-template-columns: 90px 90px 1fr; gap: 8px; }
  .devlist { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .devitem {
    padding: 10px 14px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--line);
    font-size: 12px;
  }
  .devtop { display: flex; align-items: center; gap: 10px; }
  .devtop .vv { color: var(--dim); font-family: monospace; font-size: 11px; }
  .devtop button { margin-left: auto; }
  .cols { margin: 8px 0 0 0; padding: 0; list-style: none; }
  .cols li { margin: 3px 0; color: var(--dim); font-size: 11.5px; }
  .cols .up { color: var(--text); font-family: monospace; }
  .rep {
    display: inline-block; margin: 2px 4px 2px 0; padding: 1px 7px;
    border: 1px solid var(--line-hi); border-radius: 5px;
    font-family: monospace; font-size: 10.5px; color: var(--dim);
    cursor: pointer;
  }
  .rep:hover { border-color: var(--accent); color: var(--accent-hi); }
  .rep.out { border-color: rgba(99,102,241,.5); color: var(--accent-hi); }
  .inp {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; height: 34px; padding: 0 10px; color: var(--text);
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark">GP</span>USB 探测</div>
  <span class="pill"><span class="dot" id="dot"></span><span id="state">未授权</span></span>
  <span class="spacer"></span>
  <a class="btn ghost" href="../index.html">返回配置</a>
  <button class="btn primary" id="btnPick">选择 HID 设备</button>
</header>

<main class="wrap">
  <div class="grid">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">

      <section class="card">
        <header class="card-head"><h2>已授权设备</h2><span class="meta" id="cnt"></span></header>
        <div class="devlist" id="devlist"></div>
      </section>

      <section class="card">
        <header class="card-head"><h2>发送报告</h2><span class="meta">点上面的报告标签可自动填入</span></header>
        <div class="row2">
          <div class="field" style="margin:0">
            <div class="lb"><span>报告 ID</span></div>
            <input id="rid" class="mono inp" value="0">
          </div>
          <div class="field" style="margin:0">
            <div class="lb"><span>长度</span></div>
            <input id="rlen" class="mono inp" value="8">
          </div>
          <div class="field" style="margin:0">
            <div class="lb"><span>载荷（十六进制）</span></div>
            <input id="rhex" class="mono inp" value="00 00 00 00 00 00 00 00">
          </div>
        </div>
        <div class="row mt">
          <button class="btn primary" id="btnSend">发送 Output Report</button>
          <button class="btn" id="btnFeature">读 Feature Report</button>
          <span class="hint" style="margin:0">读写前必须「设为当前」</span>
        </div>
      </section>

      <section class="card">
        <header class="card-head"><h2>收包日志</h2><span class="meta"><button class="linkbtn" id="btnClear">清空</button></span></header>
        <div class="log" id="log" style="height:170px"></div>
      </section>
    </div>

    <aside class="side">
      <section class="card">
        <header class="card-head"><h2>说明</h2></header>
        <p class="hint" style="margin-top:0">
          WebHID 只能访问 <b>厂商自定义集合</b>（usage page ≥ 0xFF00）。
          标准键盘/鼠标集合被浏览器禁止。
        </p>
        <p class="hint">
          发送失败通常是<b>报告 ID 或长度不对</b>。
          点上面集合里的报告标签（如 <span class="rep out">out id=7 · 7B</span>）会自动填入正确参数。
        </p>
      </section>
    </aside>
  </div>
</main>

<script src="hid.js?v=202610291657"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const H = window.GSHID;
  let active = null;

  function log(msg, cls) {
    const d = document.createElement('div');
    d.innerHTML = `<span class="t">${new Date().toLocaleTimeString('zh-CN')}</span> <span class="${cls || ''}">${msg}</span>`;
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
  }
  const hex = (b) => Array.from(b).map((x) => x.toString(16).padStart(2, '0')).join(' ');

  function reportBytes(r) {
    let bits = 0;
    (r.items || []).forEach((it) => { bits += (it.reportSize || 0) * (it.reportCount || 0); });
    return Math.ceil(bits / 8);
  }

  function fillForm(id, bytes) {
    $('rid').value = id;
    $('rlen').value = bytes;
    $('rhex').value = new Array(bytes).fill('00').join(' ');
  }

  function renderReports(list, kind) {
    if (!list || !list.length) return '';
    return list.map((r) => {
      const n = reportBytes(r);
      const cls = kind === 'out' ? 'rep out' : 'rep';
      const tag = kind === 'out' ? 'out' : (kind === 'in' ? 'in' : 'feat');
      return `<span class="${cls}" data-id="${r.reportId}" data-len="${n}">${tag} id=${r.reportId} · ${n}B</span>`;
    }).join(' ');
  }

  async function refresh() {
    if (!H.supported()) {
      $('state').textContent = '浏览器不支持 WebHID';
      return;
    }
    const devices = await H.list();
    $('cnt').textContent = devices.length + ' 个';
    const box = $('devlist');
    box.innerHTML = '';
    if (!devices.length) {
      box.innerHTML = '<div class="hint">还没有设备。点右上角「选择 HID 设备」。</div>';
      return;
    }
    devices.forEach((d) => {
      const el = document.createElement('div');
      el.className = 'devitem';

      const cols = (d.collections || []).map((c) => {
        const vendor = c.usagePage >= 0xFF00;
        const outs = renderReports(c.outputReports, 'out');
        const ins = renderReports(c.inputReports, 'in');
        const fes = renderReports(c.featureReports, 'feat');
        return `<li>usagePage <span class="up">0x${c.usagePage.toString(16).toUpperCase()}</span> · usage 0x${c.usage.toString(16)}` +
          `${vendor ? ' · <b style="color:var(--accent-hi)">厂商</b>' : ''}<br>${outs || ''} ${ins || ''} ${fes || ''}` +
          `${!outs && !ins && !fes ? '<span style="color:var(--mute)">无报告</span>' : ''}</li>`;
      }).join('');

      el.innerHTML =
        `<div class="devtop"><div><div>${d.productName || '(无名称)'}</div>` +
        `<div class="vv">VID 0x${d.vendorId.toString(16)} · PID 0x${d.productId.toString(16)}</div></div></div>` +
        `<ul class="cols">${cols || '<li>无集合信息</li>'}</ul>`;

      const btn = document.createElement('button');
      btn.className = 'btn mini primary';
      btn.textContent = '设为当前';
      btn.onclick = async () => {
        try {
          await H.open(d);
          active = d;
          $('state').textContent = d.productName || '已打开';
          $('dot').className = 'dot on';
          H.onInput((data, rid) => log('IN id=' + rid + ' · ' + hex(data), 'rx'));
          log('已打开 ' + (d.productName || ''), 'rx');
        } catch (e) {
          log('打开失败：' + (e.message || e), 'er');
        }
      };
      el.querySelector('.devtop').appendChild(btn);

      el.querySelectorAll('.rep').forEach((sp) => {
        sp.onclick = () => fillForm(sp.dataset.id, Number(sp.dataset.len));
      });

      box.appendChild(el);
    });
  }

  $('btnPick').onclick = async () => {
    try { await H.pick(); await refresh(); }
    catch (e) { log('选择失败：' + (e.message || e), 'er'); }
  };

  $('btnSend').onclick = async () => {
    if (!active) { log('先在列表里点「设为当前」', 'er'); return; }
    const rid = parseInt($('rid').value, 10) || 0;
    const hexStr = $('rhex').value.trim().replace(/[,\s]+/g, '');
    const bytes = [];
    for (let i = 0; i < hexStr.length; i += 2) bytes.push(parseInt(hexStr.slice(i, i + 2), 16) || 0);
    const len = parseInt($('rlen').value, 10) || bytes.length;
    while (bytes.length < len) bytes.push(0);
    const payload = new Uint8Array(bytes.slice(0, len));
    log('OUT id=' + rid + ' len=' + len + ' · ' + hex(payload), 'tx');
    try {
      await H.send(rid, payload);
      log('✅ 发送成功', 'rx');
    } catch (e) {
      log('发送失败：' + (e.message || e), 'er');
    }
  };

  $('btnFeature').onclick = async () => {
    if (!active) { log('先设为当前设备', 'er'); return; }
    const rid = parseInt($('rid').value, 10) || 0;
    try {
      const data = await H.readFeature(rid);
      log('FEATURE id=' + rid + ' → ' + hex(data), 'rx');
    } catch (e) {
      log('读 Feature 失败：' + (e.message || e), 'er');
    }
  };

  $('btnClear').onclick = () => { $('log').innerHTML = ''; };

  refresh();
})();
</script>
</body>
</html>
